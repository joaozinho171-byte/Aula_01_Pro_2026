<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GAME-SABER | Quiz</title>
    <link rel="stylesheet" href="style.css">

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
        }

        #container {
            min-height: 90vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            max-width: 700px;
            margin: 0 auto;
        }

        img {
            width: 40%;
            max-width: 300px;
            height: auto;
            border-radius: 8px;
        }

        /* Estilos dos Cards */
        .card {
            background-color: #ffffff;
            border-radius: 12px;
            padding: 25px;
            margin-top: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 100%;
            box-sizing: border-box;
        }

        /* Form / Login */
        .login-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 15px;
        }

        .login-input {
            padding: 12px;
            font-size: 1rem;
            border: 2px solid #ccc;
            border-radius: 6px;
            text-align: center;
            outline: none;
        }

        .login-input:focus {
            border-color: #2e7d32;
        }

        /* Quiz UI */
        .info-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            margin-bottom: 15px;
            background-color: #e8f5e9;
            padding: 10px 15px;
            border-radius: 8px;
            color: #2e7d32;
        }

        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 15px;
        }

        .btn-main {
            background-color: #2e7d32;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 1rem;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-main:hover:not(:disabled) {
            background-color: #1b5e20;
        }

        .btn-main:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-secondary {
            background-color: #0288d1;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 15px;
        }

        .btn-secondary:hover {
            background-color: #01579b;
        }

        .feedback {
            margin-top: 15px;
            font-weight: bold;
            min-height: 24px;
        }

        .badge {
            display: inline-block;
            background-color: #fbc02d;
            color: #333;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: bold;
            margin-top: 10px;
        }

        .hide {
            display: none;
        }
    </style>
</head>

<body>

    <div id="container">

        <h1><b><u> GAME DO SABER </u></b></h1>
        <p>NOSSA ESCOLA NOSSO COMPROMISSO</p>

        <figure>
            <img src="days.jpeg" alt="Antes e depois da manutenção do ventilador">
            <figcaption><b>antes e depois - "ventilador"</b></figcaption>
        </figure>

        <!-- 1. Painel de Login / Identificação -->
        <div class="card" id="login-card">
            <h2>Identifique-se para Jogar</h2>
            <p>Digite seu nome ou apelido para começar o quiz e salvar sua pontuação:</p>
            <form class="login-form" id="login-form">
                <input type="text" id="username" class="login-input" placeholder="Seu Nome ou Apelido" required maxlength="20">
                <button type="submit" class="btn-main">Entrar no Game</button>
            </form>
        </div>

        <!-- 2. Container do Quiz -->
        <div class="card hide" id="quiz-card">
            <div class="info-bar">
                <span id="player-display">Jogador: </span>
                <span id="score-tracker">Pontos: 0</span>
            </div>

            <h2 id="question-title">Carregando pergunta...</h2>
            
            <div class="options-grid" id="options-container">
                <!-- Botões gerados via JS -->
            </div>

            <p class="feedback" id="feedback-text"></p>
        </div>

        <!-- 3. Tela de Resultado Final -->
        <div class="card hide" id="result-card">
            <h2>Quiz Concluído! 🎉</h2>
            <p id="final-score"></p>
            <div id="achievement-badge" class="badge"></div>
            <p id="high-score-display" style="margin-top: 15px; font-weight: bold; color: #555;"></p>
            
            <button class="btn-secondary" onclick="restartQuiz()">Jogar Novamente</button>
            <button class="btn-secondary" style="background-color: #d32f2f;" onclick="logout()">Trocar de Usuário</button>
        </div>

    </div>

    <script>
        const questionsList = [
            {
                question: "O que fazer ao ver uma mesa ou cadeira rabiscada na sala?",
                options: [
                    { text: "Avisar um professor ou funcionário para limparem", correct: true },
                    { text: "Rabiscar mais um pouco para desenhar por cima", correct: false },
                    { text: "Ignorar, pois não fui eu quem fiz", correct: false }
                ]
            },
            {
                question: "De quem é a responsabilidade de cuidar do patrimônio da escola?",
                options: [
                    { text: "Apenas dos faxineiros e diretores", correct: false },
                    { text: "Apenas dos alunos da manhã", correct: false },
                    { text: "De todos os estudantes, professores e funcionários", correct: true }
                ]
            },
            {
                question: "Qual atitude ajuda a economizar energia e manter os equipamentos seguros?",
                options: [
                    { text: "Deixar ventiladores e luzes ligados na sala vazia", correct: false },
                    { text: "Desligar os aparelhos ao sair da sala e não mexer na fiação", correct: true },
                    { text: "Mover o ventilador com força enquanto ele funciona", correct: false }
                ]
            },
            {
                question: "Como devemos tratar os livros e materiais da biblioteca escolar?",
                options: [
                    { text: "Manter limpos, sem rasgar ou rasurar as páginas", correct: true },
                    { text: "Dobrar as páginas para marcar onde parou a leitura", correct: false },
                    { text: "Levar para casa sem autorização da escola", correct: false }
                ]
            }
        ];

        let questions = [];
        let currentQuestionIndex = 0;
        let score = 0;
        let currentUser = "";
        let audioCtx = null;

        // Elementos HTML
        const loginCard = document.getElementById("login-card");
        const quizCard = document.getElementById("quiz-card");
        const resultCard = document.getElementById("result-card");
        const loginForm = document.getElementById("login-form");
        const usernameInput = document.getElementById("username");
        const playerDisplay = document.getElementById("player-display");
        const questionTitle = document.getElementById("question-title");
        const optionsContainer = document.getElementById("options-container");
        const feedbackText = document.getElementById("feedback-text");
        const scoreTracker = document.getElementById("score-tracker");
        const finalScore = document.getElementById("final-score");
        const achievementBadge = document.getElementById("achievement-badge");
        const highScoreDisplay = document.getElementById("high-score-display");

        // Sistema de Login
        loginForm.addEventListener("submit", (e) => {
            e.preventDefault();
            const name = usernameInput.value.trim();
            if (name) {
                currentUser = name;
                localStorage.setItem("gameSaber_user", currentUser);
                initGame();
            }
        });

        function checkExistingUser() {
            const savedUser = localStorage.getItem("gameSaber_user");
            if (savedUser) {
                currentUser = savedUser;
                initGame();
            }
        }

        function logout() {
            localStorage.removeItem("gameSaber_user");
            currentUser = "";
            resultCard.classList.add("hide");
            loginCard.classList.remove("hide");
            usernameInput.value = "";
        }

        // Web Audio API
        function playSound(type) {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'correct') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(587.33, audioCtx.currentTime);
                osc.frequency.setValueAtTime(880, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.3);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            } else {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.3);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            }
        }

        // Lógica do Quiz
        function initGame() {
            loginCard.classList.add("hide");
            resultCard.classList.add("hide");
            quizCard.classList.remove("hide");
            
            playerDisplay.textContent = `Jogador: ${currentUser}`;
            currentQuestionIndex = 0;
            score = 0;
            
            // Embaralha as perguntas
            questions = [...questionsList].sort(() => Math.random() - 0.5);
            
            updateScoreDisplay();
            showQuestion();
        }

        function updateScoreDisplay() {
            scoreTracker.textContent = `Pontos: ${score * 10}`;
        }

        function showQuestion() {
            feedbackText.textContent = "";
            const currentQuestion = questions[currentQuestionIndex];
            questionTitle.textContent = `${currentQuestionIndex + 1}. ${currentQuestion.question}`;
            optionsContainer.innerHTML = "";

            currentQuestion.options.forEach(option => {
                const button = document.createElement("button");
                button.textContent = option.text;
                button.classList.add("btn-main");
                button.addEventListener("click", () => selectOption(option.correct));
                optionsContainer.appendChild(button);
            });
        }

        function selectOption(isCorrect) {
            const buttons = optionsContainer.querySelectorAll("button");
            buttons.forEach(btn => btn.disabled = true);

            if (isCorrect) {
                score++;
                updateScoreDisplay();
                playSound('correct');
                feedbackText.style.color = "green";
                feedbackText.textContent = "Resposta Correta! 🎉 (+10 pts)";
            } else {
                playSound('wrong');
                feedbackText.style.color = "red";
                feedbackText.textContent = "Resposta Incorreta! ❌";
            }

            setTimeout(() => {
                currentQuestionIndex++;
                if (currentQuestionIndex < questions.length) {
                    showQuestion();
                } else {
                    showResult();
                }
            }, 1200);
        }

        function showResult() {
            quizCard.classList.add("hide");
            resultCard.classList.remove("hide");
            
            const totalPoints = score * 10;
            const maxPoints = questions.length * 10;
            finalScore.textContent = `${currentUser}, sua pontuação foi: ${totalPoints} de ${maxPoints} pontos! (${score}/${questions.length} acertos)`;

            // Sistema de Conquistas/Títulos
            let badgeText = "";
            if (score === questions.length) {
                badgeText = "🏆 Nível: Guardião Máximo da Escola!";
            } else if (score >= questions.length / 2) {
                badgeText = "⭐ Nível: Protetor do Patrimônio";
            } else {
                badgeText = "🌱 Nível: Aprendiz de Cuidado Escolar";
            }
            achievementBadge.textContent = badgeText;

            // Recorde (LocalStorage)
            const savedHighScore = localStorage.getItem(`highScore_${currentUser}`) || 0;
            if (totalPoints > savedHighScore) {
                localStorage.setItem(`highScore_${currentUser}`, totalPoints);
                highScoreDisplay.textContent = `🎉 Novo Recorde Pessoal: ${totalPoints} PONTOS!`;
            } else {
                highScoreDisplay.textContent = `Seu Recorde Pessoal Atual: ${savedHighScore} PONTOS`;
            }
        }

        function restartQuiz() {
            initGame();
        }

        // Verifica se o usuário já fez login anteriormente
        checkExistingUser();
    </script>

</body>
</html>
