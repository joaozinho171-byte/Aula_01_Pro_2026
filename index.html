<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GAME-SABER | Quiz</title>
    <link rel="stylesheet" href="style.css">

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
        }

        #container {
            min-height: 90vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            max-width: 700px;
            margin: 0 auto;
        }

        img {
            width: 40%;
            max-width: 300px;
            height: auto;
            border-radius: 8px;
        }

        /* Estilos do Quiz */
        .quiz-card {
            background-color: #ffffff;
            border-radius: 12px;
            padding: 20px;
            margin-top: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 100%;
            box-sizing: border-box;
        }

        .score-tracker {
            font-weight: bold;
            margin-bottom: 10px;
            color: #2e7d32;
            font-size: 1.2rem;
        }

        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 15px;
        }

        .btn-option {
            background-color: #2e7d32;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 1rem;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-option:hover:not(:disabled) {
            background-color: #1b5e20;
        }

        .btn-option:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-restart {
            background-color: #0288d1;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 15px;
        }

        .btn-restart:hover {
            background-color: #01579b;
        }

        .feedback {
            margin-top: 15px;
            font-weight: bold;
            min-height: 24px;
        }

        .hide {
            display: none;
        }
    </style>
</head>

<body>

    <div id="container">

        <h1><b><u> GAME DO SABER </u></b></h1>
        <p>NOSSA ESCOLA NOSSO COMPROMISSO</p>
        <p><u>O QUE NÓS PODEMOS FAZER PARA TORNAR NOSSA ESCOLA AINDA MELHOR?</u></p>

        <figure>
            <img src="days.jpeg" alt="Antes e depois da manutenção do ventilador">
            <figcaption><b>antes e depois - "ventilador"</b></figcaption>
        </figure>

        <!-- Container do Quiz -->
        <div class="quiz-card" id="quiz">
            <div class="score-tracker" id="score-tracker">Pontos: 0</div>
            <h2 id="question-title">Carregando pergunta...</h2>
            
            <div class="options-grid" id="options-container">
                <!-- Botões inseridos via JavaScript -->
            </div>

            <p class="feedback" id="feedback-text"></p>
        </div>

        <!-- Tela de Resultado Final -->
        <div class="quiz-card hide" id="result-card">
            <h2>Quiz Concluído! 🎉</h2>
            <p id="final-score"></p>
            <button class="btn-restart" onclick="restartQuiz()">Jogar Novamente</button>
        </div>

    </div>

    <script>
        const questions = [
            {
                question: "O que fazer ao ver uma mesa ou cadeira rabiscada na sala?",
                options: [
                    { text: "Avisar um professor ou funcionário para limparem", correct: true },
                    { text: "Rabiscar mais um pouco para desenhar por cima", correct: false },
                    { text: "Ignorar, pois não fui eu quem fiz", correct: false }
                ]
            },
            {
                question: "De quem é a responsabilidade de cuidar do patrimônio da escola?",
                options: [
                    { text: "Apenas dos faxineiros e diretores", correct: false },
                    { text: "Apenas dos alunos da manhã", correct: false },
                    { text: "De todos os estudantes, professores e funcionários", correct: true }
                ]
            },
            {
                question: "Qual atitude ajuda a economizar energia e manter os equipamentos seguros?",
                options: [
                    { text: "Deixar ventiladores e luzes ligados na sala vazia", correct: false },
                    { text: "Desligar os aparelhos ao sair da sala e não mexer na fiação", correct: true },
                    { text: "Mover o ventilador com força enquanto ele funciona", correct: false }
                ]
            }
        ];

        let currentQuestionIndex = 0;
        let score = 0;
        let audioCtx = null;

        const questionTitle = document.getElementById("question-title");
        const optionsContainer = document.getElementById("options-container");
        const feedbackText = document.getElementById("feedback-text");
        const scoreTracker = document.getElementById("score-tracker");
        const quizCard = document.getElementById("quiz");
        const resultCard = document.getElementById("result-card");
        const finalScore = document.getElementById("final-score");

        // Função para gerar efeitos sonoros via Web Audio API
        function playSound(type) {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }

            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'correct') {
                // Som agudo de acerto
                osc.type = 'sine';
                osc.frequency.setValueAtTime(587.33, audioCtx.currentTime); // Nota D5
                osc.frequency.setValueAtTime(880, audioCtx.currentTime + 0.1); // Nota A5
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.3);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            } else {
                // Som grave de erro
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.3);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            }
        }

        function startQuiz() {
            currentQuestionIndex = 0;
            score = 0;
            updateScoreDisplay();
            resultCard.classList.add("hide");
            quizCard.classList.remove("hide");
            showQuestion();
        }

        function updateScoreDisplay() {
            scoreTracker.textContent = `Pontos: ${score * 10}`;
        }

        function showQuestion() {
            feedbackText.textContent = "";
            const currentQuestion = questions[currentQuestionIndex];
            questionTitle.textContent = currentQuestion.question;
            optionsContainer.innerHTML = "";

            currentQuestion.options.forEach(option => {
                const button = document.createElement("button");
                button.textContent = option.text;
                button.classList.add("btn-option");
                button.addEventListener("click", () => selectOption(option.correct));
                optionsContainer.appendChild(button);
            });
        }

        function selectOption(isCorrect) {
            // Desabilita os botões para evitar múltiplos cliques na mesma pergunta
            const buttons = optionsContainer.querySelectorAll("button");
            buttons.forEach(btn => btn.disabled = true);

            if (isCorrect) {
                score++;
                updateScoreDisplay();
                playSound('correct');
                feedbackText.style.color = "green";
                feedbackText.textContent = "Resposta Correta! 🎉 (+10 pts)";
            } else {
                playSound('wrong');
                feedbackText.style.color = "red";
                feedbackText.textContent = "Resposta Incorreta! ❌";
            }

            setTimeout(() => {
                currentQuestionIndex++;
                if (currentQuestionIndex < questions.length) {
                    showQuestion();
                } else {
                    showResult();
                }
            }, 1200);
        }

        function showResult() {
            quizCard.classList.add("hide");
            resultCard.classList.remove("hide");
            const totalPoints = score * 10;
            const maxPoints = questions.length * 10;
            finalScore.textContent = `Sua pontuação total foi: ${totalPoints} de ${maxPoints} pontos! (${score}/${questions.length} acertos)`;
        }

        function restartQuiz() {
            startQuiz();
        }

        // Inicia o quiz ao carregar a página
        startQuiz();
    </script>

</body>
</html>
